# Tests every pull request. A version tag (v0.6.0) also builds the image and
# pushes it to ghcr.io/jstraw4663/chapterkeeparr as :0.6.0 and :latest.
# Running it by hand from a branch pushes :<branch> only, for trying a build
# in a separate container without touching :latest.
name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Prepare disposable browser fixture
        run: python tests/fixtures/ui_seed.py /tmp/ck-ui-check
      - name: Download pinned accessibility checker
        run: |
          curl --fail --location --max-time 30 https://cdn.jsdelivr.net/npm/axe-core@4.10.3/axe.min.js --output /tmp/axe.min.js
          echo '880970c081707360e64f34cea25ff91892f5bc95675b0776925b9709dd8a68bb  /tmp/axe.min.js' | sha256sum --check
      - name: Run responsive browser checks
        env:
          ENABLE_WORKERS: '0'
          CONFIG_DIR: /tmp/ck-ui-check/config
          LIBRARY_ROOTS: /tmp/ck-ui-check/library
        run: |
          python -m uvicorn app.api:create_app --factory --port 8767 > /tmp/ck-ui-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8767/api/health', timeout=1)
                  break
              except OSError:
                  time.sleep(.25)
          else:
              raise RuntimeError('Fixture server did not start')
          PY
          python tests/browser/accessibility_stability.py --axe /tmp/axe.min.js --output /tmp/ck-ui-results/stability
          python tests/browser/ui_regression.py --axe /tmp/axe.min.js --output /tmp/ck-ui-results
          python tests/browser/reconciled_workflows.py --axe /tmp/axe.min.js --output /tmp/ck-ui-results/reconciled
          python tests/browser/bedlam_workflow.py --axe /tmp/axe.min.js --output /tmp/ck-ui-results/bedlam
          python tests/browser/match_quality.py --axe /tmp/axe.min.js --output /tmp/ck-ui-results/quality
          python tests/browser/branding.py --output /tmp/ck-ui-results/branding
          python tests/browser/flow_stability.py --axe /tmp/axe.min.js --output /tmp/ck-ui-results/flow
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ui-regression-results
          path: |
            /tmp/ck-ui-results
            /tmp/ck-ui-server.log

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the README title matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          if ! head -1 README.md | grep -qF "# ChapterKeeparr ${version} "; then
            echo "::error::README.md must start with '# ChapterKeeparr ${version} (alpha)' before tagging ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/jstraw4663/chapterkeeparr
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=branch
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_CHANNEL=${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'development' }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
