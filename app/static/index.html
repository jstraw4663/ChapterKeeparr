<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <title>ChapterKeeparr</title>
  <link rel="preload" href="/static/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // Apply theme and motion before first paint (full logic: js/shell.js applyAppearance).
    (function () {
      var p = {};
      try { p = JSON.parse(localStorage.getItem('chapterkeeparr.prefs.v1') || '{}'); } catch (e) {}
      var root = document.documentElement;
      if (p.theme === 'light' || p.theme === 'dark') root.setAttribute('data-theme', p.theme);
      if (p.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches) root.setAttribute('data-motion', 'reduce');
      var w = innerWidth, c = p.sidebarCollapsed;
      if (c === true || (c == null && w >= 768 && w < 1100)) root.classList.add('collapsed');
      var bg = getComputedStyle(root).getPropertyValue('--bg').trim();
      if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
    })();
  </script>
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <noscript><p style="padding:24px">ChapterKeeparr needs JavaScript to show your library.</p></noscript>
</body>
</html>
